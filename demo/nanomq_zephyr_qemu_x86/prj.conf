# NanoMQ → Zephyr broker demo configuration
#
# Baseline: demo/zephyr_mqtt/prj.conf in NanoNNG (proven on qemu_x86),
# with resource sizing bumped for the broker and SLIRP hostfwd added
# so the host can reach the guest broker on tcp:1883.

# POSIX API — provides pthread, sockets, poll (Zephyr pthread stack comes
# from the dynamic thread pool: DYNAMIC_THREAD_STACK_SIZE below)
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
# Zephyr POSIX objects come from fixed pools.  nng maps its mutex/condvar
# onto pthread_* , and nni_plat_{mtx,cv}_init RETRY FOREVER when the pool
# is exhausted (nng/src/platform/zephyr/zephyr_thread.c) — an exhausted
# pool stalls the calling thread invisibly (observed: broker boot with
# REST+webhook reaches a 245/256 mutex baseline, then the REST
# inproc_server thread hangs forever in nng_rep0_open trying to grab the
# 246th).  nng's dynamic model (mutex per sock/ctx/aio/work, webhook
# pool_size=32 works x 2 aios each) does not fit small fixed pools, so
# budget generously: 1024 slots cost only ~30 KB of static arrays.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=1024
CONFIG_MAX_PTHREAD_COND_COUNT=1024
# Rwlocks are per topic-tree node (nanolib mqtt_db.c: every dbtree_node_new
# takes one, every dbtree_node_free returns it), so the live count tracks
# distinct topics in the subscription tree, not connections.  32 dies as
# soon as a load test publishes to more than a handful of topics — the
# survival group hit nni_panic("pthread_rwlock_init: pool exhausted") at
# ~30 topics.  Host POSIX builds have no fixed pool at all; Zephyr needs
# the budget spelled out.
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=256
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y
# Zephyr's zvfs_poll() maps the whole poll() fd set onto ONE shared array
# of k_poll_event's, bounded by CONFIG_ZVFS_POLL_MAX (Kconfig default 3!).
# nng's pollq puts every armed socket into a single poll() call (wake
# "pipe" is a dummy fd that consumes no slot), so the broker needs one
# slot per listener/connection direction: 3 listeners + 2 connections
# already exceeds the default and zvfs_poll then returns -1/ENOMEM on
# every call (nng's pollq would busy-spin and starve all I/O — see
# zephyr_pollq_poll.c error handling).  Budget for the demo scale:
# 3 listeners + up to ~6 concurrent MQTT/webhook conns x 2 directions.
# (The value itself is set with the network pools further down, §7-18.)

# Networking — broker listens on TCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# DNS (not strictly needed by the broker, kept for completeness)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2

# QEMU user-mode networking with host forward.
# Bind 0.0.0.0: the "host" of SLIRP is the docker container running qemu;
# binding all container interfaces lets the outer host reach the guest
# broker via the container IP (bridge network).
#   container tcp:1883  ->  guest 10.0.2.15:1883 (broker listen address)
#   container tcp:8081  ->  guest 10.0.2.15:8081 (REST API, BROKER_REST_API)
#   container tcp:8083  ->  guest 10.0.2.15:8083 (MQTT/WS, BROKER_WS)
CONFIG_NET_QEMU_USER=y
CONFIG_NET_QEMU_USER_EXTRA_ARGS="hostfwd=tcp:0.0.0.0:1883-:1883,hostfwd=tcp:0.0.0.0:8081-:8081,hostfwd=tcp:0.0.0.0:8083-:8083"

# e1000 driver for the qemu_x86 "eth0" node — NET_QEMU_USER only implies
# the Ethernet L2; without the driver there is no real NIC (net_config
# would have put 10.0.2.15 on the loopback iface and SLIRP frames would
# never be received).
CONFIG_ETH_E1000=y

# Static guest IP — SLIRP only forwards to 10.0.2.15 (its fixed notion of
# the guest); without an address on the interface the guest drops every
# forwarded SYN at the IP layer.  net_config applies it in an APPLICATION
# SYS_INIT (before main), so the broker's listen is reachable by the time
# the demo starts.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_AUTO_INIT=y

# Memory and stack sizing — the broker heap holds nng taskq/poller
# threads, work structs, MQTT messages and the nanolib session db.
# Tune CONFIG_HEAP_MEM_POOL_SIZE / *STACK* when enlarging conf->parallel.
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_MAIN_STACK_SIZE=16384

# nng's Zephyr platform alloc is plain malloc() (zephyr_alloc.c), so the
# libc malloc arena IS the broker heap.  With MMU enabled (qemu_x86's
# default) COMMON_LIBC_MALLOC_ARENA_SIZE defaults to a mere 16384 and
# larger allocations (e.g. per-pipe rlmq resize of msq_len*8 bytes) fail;
# the CONFIG_HEAP_MEM_POOL_SIZE pool above serves k_malloc() only and is
# not used by nng.  Size the arena for the broker workload explicitly.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# Enable FPU so the SSE/SSE2/SSE3/SSSE3 Kconfig options become visible
CONFIG_FPU=y

# CPU instruction sets up to what the emulated CPU (qemu32, CPU_ATOM)
# provides: MMX/SSE/SSE2/SSE3.  SSSE3 must NOT be enabled — qemu32 and
# Zephyr's CPU_ATOM model lack it (Kconfig drops the assignment to n and
# the build aborts on the warning).
CONFIG_X86_SSE=y
CONFIG_X86_SSE2=y
CONFIG_X86_SSE3=y

# Networking buffers — bumped for broker pub/sub forwarding
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Zephyr network resource pools — sized for a broker, not a sensor node.
# Every socket (listening or connected) takes one net_context and one
# net_conn, and the defaults (6 / 8) leave only ~3 slots once the three
# listeners (1883 + 8081 + 8083) exist.  When the pool is exhausted Zephyr's TCP
# answers the next SYN with RST — tcp.c tcp_conn_new(): net_context_get()
# fails → "Cannot allocate a new TCP connection" → net_tcp_reply_rst(),
# which the client sees as "Connection reset by peer".  Measured before
# the change: 6 concurrent MQTT connects → 2 CONNACKs; 20 back-to-back
# connects at 50 ms spacing → 9/20; at 300 ms → 20/20.  That is what made
# the CI v5 suite (5-6 concurrent subscribers, sub→pub→sub churn) fail
# intermittently.  Also size the zvfs fd table (ZVFS_OPEN_ADD_SIZE_NET,
# which defaults to NET_MAX_CONTEXTS) and the nng pollq's poll() event
# budget (ZVFS_POLL_MAX: one slot per socket direction).
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=32
CONFIG_ZVFS_POLL_MAX=64

CONFIG_PRINTK=y

# Debug: bump NanoMQ log level to DEBUG (remove for normal runs)
CONFIG_BROKER_LOG_DEBUG=y

# NanoMQ HTTP REST API — conf http_server.enable + BASIC auth with the
# credentials from CONFIG_BROKER_REST_USER / _PASS (Kconfig BROKER_REST_API
# enables the listener).  Served on the tcp:8081 hostfwd above; conf_init
# defaults http_server.enable to false, so without this switch the guest has
# no listener on 8081 and SLIRP answers RST.  Clients must send credentials:
#   curl -u admin:public http://<host>:8081/api/v4/...
# The demo defaults to the published admin/public pair and warns at boot;
# override them from a local conf file for anything but a bench setup.
# Basic over plain HTTP is base64, not encryption — TLS is out of the
# Zephyr NanoNNG build.
CONFIG_BROKER_REST_API=y

# NanoMQ webhook forwarder — conf web_hook.enable + inproc hook channel +
# MESSAGE_PUBLISH("hook/#") / CLIENT_CONNACK rules in main.c (Kconfig
# BROKER_WEBHOOK).  Event POSTs go to the QEMU-host alias 10.0.2.2, so a
# hook_receiver.py started on the machine running qemu is reachable as-is.
#
# OFF by default, like the ESP32-S3 demo.  The CLIENT_CONNACK rule fires on
# every client connect, so with the forwarder on and no receiver listening
# each connect costs a failed HTTP attempt plus two log lines — that
# measurably perturbs the suite's timing-sensitive subtests (measured on the
# board: 97 failed POSTs in one mqtt_v5 run, retain subtest failing all three
# attempts; PORTING_ZEPHYR.md §22-6).  Enable it only to exercise webhook:
# uncomment both lines below (the URL is what turns the forwarder on —
# main.c checks it is non-empty), or pass an overlay with
#   west build ... -- -DEXTRA_CONF_FILE=webhook.conf
#CONFIG_BROKER_WEBHOOK=y
#CONFIG_BROKER_WEBHOOK_URL="http://10.0.2.2:18080/"

# NanoMQ WebSocket listener — conf websocket.enable + websocket.url in
# main.c (Kconfig BROKER_WS).  MQTT over RFC6455 on nmq-ws://:8083/mqtt,
# served by the mqttws transport in the NanoNNG build (the tcp:8083
# hostfwd above forwards it to the host).  TLS is out of the Zephyr
# NanoNNG, so wss: is inert.
CONFIG_BROKER_WS=y
