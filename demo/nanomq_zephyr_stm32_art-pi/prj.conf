# NanoMQ broker → ART-Pi (art_pi / STM32H750XBH6) demo config.
#
# Derived from demo/nanomq_zephyr_esp32s3/prj.conf.  Differences:
#   * the network layer is not chosen here: it comes from an extra conf file,
#     and Wi-Fi is the default one this demo is verified with —
#       wifi.conf  Wi-Fi STA on the on-board AP6212 (+ art_pi_wifi.overlay),
#       eth.conf   on-board Ethernet PHY (RMII + LAN8720A), needs a cable,
#       usb.conf   USB-ECM device port (+ art_pi_usb.overlay), needs a host.
#     tools/flash.sh picks wifi unless told --eth/--usb.
#   * the broker data plane moves to the on-board 32 MB SDRAM instead of PSRAM
#     (CONFIG_MEMC_STM32_SDRAM + the SDRAM1 devicetree region; the heap bounds
#     are the linker fragment src/artpi_ext_ram.ld)
#   * the image links into QSPI at 0x90000000 (boards/art_pi.overlay): the
#     128 KB internal flash holds the ART-Pi factory bootloader
#   * no display — &ltdc is disabled in the overlay so its framebuffer does
#     not compete with the broker heap for the SDRAM window
#   * REST credentials are NOT here: BROKER_REST_USER/_PASS and
#     BROKER_REST_ALLOW_PUBLISHED come from a local, git-ignored conf file
#     (local.conf, see local.conf.example)

# POSIX API — pthreads/sockets/poll for nng + NanoMQ.  nng creates a
# mutex/condvar per sock/ctx/aio/work and retries forever when Zephyr's fixed
# pool is exhausted, so budget generously (1024 slots cost ~30 KB of static
# arrays).
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=1024
CONFIG_MAX_PTHREAD_COND_COUNT=1024
# Rwlocks track distinct topics in the nanolib subscription tree (one per
# dbtree node); 256 covers the demo scale.
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=256
# nng taskq/poller threads and dynamic POSIX threads live on the kernel heap
# (k_malloc).  DYNAMIC_THREAD_STACK_SIZE is the per-pthread stack:
# 16 threads x 16 KB = 256 KB of the HEAP_MEM_POOL_SIZE budget below.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y
# zvfs_poll() maps the whole poll() fd set onto one shared k_poll_event array
# (Kconfig default 3!); nng's pollq puts every armed socket into a single
# poll(), so budget one slot per listener/connection direction.
CONFIG_ZVFS_POLL_MAX=64

# Networking — common to every variant; which link carries it (Wi-Fi by
# default) is decided by wifi.conf / eth.conf / usb.conf, see the top of this
# file.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
# Deliberately NOT CONFIG_NET_CONFIG_SETTINGS: that module's AUTO_INIT
# defaults to y and runs a SYS_INIT hook that configures a static address
# before the driver/interface is ready (the ESP32-S3 demo's §22-4 trap).
# main.c starts the DHCPv4 client itself and waits for the BOUND event.
CONFIG_NET_DHCPV4=y

# Net-stack pools — broker scale.  Every socket (listening or connected) takes
# one net_context + one net_conn; pool exhaustion makes Zephyr's TCP answer
# SYN with RST while the listeners still look alive.
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# SDRAM — the broker data plane (docs/adr/0002).  MEMC_STM32_SDRAM is off by
# default in this Zephyr revision, so the FMC would otherwise never be
# initialised; the region's MPU attributes are derived from the devicetree
# (zephyr,memory-attr on the sdram1 node) via CONFIG_MEM_ATTR.
CONFIG_MEMC=y
CONFIG_MEMC_STM32_SDRAM=y

# Kernel heap (k_malloc): pthread stacks (16 x 16 KB worst case), the Ethernet
# driver's allocations and Zephyr internals.  The broker's own data plane is
# NOT here — it lives in SDRAM.  CONFIG_MEM_ATTR (default y) adds the MPU
# region for the SDRAM window; CONFIG_NOCACHE_MEMORY is selected by the
# STM32 Ethernet driver (Cortex-M7 DMA buffers must not be cached).
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_STACK_SIZE=16384

# Keep the Zephyr logging subsystem on during bring-up: the Ethernet driver
# and net stack report link/PHY/DHCP progress through it.  nanolib's own log
# module is independent (ENABLE_LOG) and prints the broker banner.
# CONFIG_BROKER_LOG_DEBUG still governs nanolib's level.
CONFIG_LOG=y
CONFIG_NET_LOG=y

CONFIG_PRINTK=y

# Float support in picolibc's printf: the REST API serialises numbers with
# cJSON, whose printer uses "%g" — without this, every numeric field comes out
# as the literal "*float*" and the JSON is unparseable.
CONFIG_PICOLIBC_IO_FLOAT=y

# NanoMQ REST API — conf http_server.enable + BASIC auth with the credentials
# from CONFIG_BROKER_REST_USER / _PASS (local.conf).  Served on tcp:8081.
CONFIG_BROKER_REST_API=y

# NanoMQ WebSocket listener (MQTT over RFC6455 on tcp:8083/mqtt).  The
# functional suite's rest_get group asserts the REST view of the websocket
# configuration mirrors the listener, so the two travel together.
CONFIG_BROKER_WS=y

# webhook / DEBUG log stay off (the ESP32-S3 demo's defaults): webhook costs a
# failed HTTP attempt per client connect when no receiver is up, and DEBUG
# logging makes the 115200 console the throughput bottleneck.
CONFIG_BROKER_LOG_DEBUG=n
