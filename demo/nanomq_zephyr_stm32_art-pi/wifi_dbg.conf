# Diagnostic-only overlay: verbose logs while bringing the SDIO Wi-Fi link up.
# Pass together with wifi.conf:  -DEXTRA_CONF_FILE="local.conf;wifi.conf;wifi_dbg.conf"
#
# All modules that do not set their own level log at DEBUG, and messages are
# emitted immediately so the SDIO command sequence keeps its order.

CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=y

# Two modules log a line per SDIO transfer / per MPU region, which floods the
# 115200 console and slows the very init being debugged: keep the interesting
# modules (sd, sdio, airoc/wifi) at DEBUG but quiet these.
CONFIG_SDHC_LOG_LEVEL_ERR=y
CONFIG_MPU_LOG_LEVEL_ERR=y

# The AIROC/WHD glue logs the chip ID and the init steps at DBG.
CONFIG_WIFI_LOG_LEVEL_DBG=y

# WHD's own tracing, including the post-download verification of the firmware
# /CLM transfers.
CONFIG_AIROC_WIFI_WHD_DEBUG=y
