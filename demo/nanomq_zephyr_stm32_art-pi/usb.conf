# USB-ECM variant of this demo: the board's USB-OTG port (PA11/PA12) presents
# a CDC-ECM Ethernet function, which is the only network interface.  Pair with
# boards/art_pi_usb.overlay:
#
#   west build -b art_pi demo/nanomq_zephyr_stm32_art-pi -- \
#       -DEXTRA_CONF_FILE="local.conf;usb.conf" \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/art_pi_usb.overlay
#
# The board is the DHCPv4 *server* on that link (main.c adds a static address
# and starts the server), so the host's network manager configures the new
# interface on its own — no host-side privileges or manual ip(8) needed.  See
# the README's "USB-ECM (optional)" section.

# Legacy USB device stack.  The ECM function lives in
# subsys/usb/device/class/netusb/, which is built by this option; the newer
# device_next CDC-ECM class would need an extra devicetree node the ART-Pi
# board files do not carry.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_NETWORK_ECM=y
CONFIG_USB_DEVICE_NETWORK_ECM_MAC="02005E005301"

# The board hands out the lease, so the DHCPv4 *client* stays off: running
# both on one interface means the board would also be asking the host for an
# address it is itself serving.
CONFIG_NET_DHCPV4=n
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=2
