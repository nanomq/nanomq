# Diagnostic: enable only WHD's own tracing (its WPRINTs go straight to the
# console via printf) while keeping Zephyr's log level at its default, so the
# boot is not slowed down by our own debug logging.  This also compiles in
# whd_bus_sdio_verify_resource(), which reports a corrupted firmware/CLM
# download.
CONFIG_AIROC_WIFI_WHD_DEBUG=y
