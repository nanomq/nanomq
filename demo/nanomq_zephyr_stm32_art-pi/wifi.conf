# Wi-Fi bring-up overlay for the ART-Pi demo (trial config, see README).
#
# The ART-Pi's AP6212 is a BCM43438 wired as an SDIO function on SDMMC2.
# Zephyr's Infineon AIROC driver (WHD based) supports CYW43438 explicitly and
# has an SDIO transport; the SDIO host is the STM32 SDMMC driver.

CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
# Chip/resource selection: the AP6212 is a plain CYW43438, so use that
# firmware.  The CLM blob is the AW-CU427-P module's (the only one published
# for this part), which is not this module's calibration data; it is loaded
# anyway because the firmware's regulatory engine (and therefore the
# "country" ioctl WHD issues right after reading the FW capabilities)
# refuses to run without one.
CONFIG_CYW43438=y

# SDIO host (STM32 SDMMC2).  The transport itself is derived from the
# devicetree: because the airoc-wifi node sits on an "sd" bus, Kconfig turns
# AIROC_WIFI_BUS_SDIO (and the SDIO stack) on by itself.
CONFIG_SDHC=y
CONFIG_SDHC_STM32_SDMMC=y

# The ART-Pi's AP6212 never asserts the SDIO card interrupt, and WHD's worker
# thread reads ioctl replies only when that interrupt wakes it, so the thread
# is poked from a timer.  Neither the host controller's SD I/O mode
# (DCTRL.SDIOEN), a 1-bit bus, nor the module's out-of-band host-wake pin
# produced an interrupt here -- measurements in docs/en_US/port-to-art-pi.md
# ("no in-band SDIO card interrupt") and ADR 0003.
CONFIG_AIROC_WIFI_WHD_POKE=y

# Keep the chip out of its KSO sleep.  A sleeping device deliberately does not
# answer the first wake-up write to SDIO_SLEEP_CSR, and the host controller
# reports every unanswered command as a command-response timeout -- ~300 a
# second from here on a chip that starts sleeping ~50 s after association.
# The data path is unaffected, so this is log noise plus a power choice; a
# mains-powered broker keeps the chip awake.
CONFIG_AIROC_WIFI_DISABLE_POWERSAVE=y

# Wi-Fi interfaces are managed through the Wi-Fi mgmt API (scan/connect)
CONFIG_NET_L2_WIFI_MGMT=y


# The Ethernet node itself is disabled by boards/art_pi_wifi.overlay for Wi-Fi
# builds (pass it via -DEXTRA_DTC_OVERLAY_FILE); with the node gone neither
# Ethernet driver is instantiated, so the image has a single interface.
