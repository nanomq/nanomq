# Optional Ethernet variant of this demo.
#
# Wi-Fi is the primary path, so the Ethernet driver is not in prj.conf.  Build
# with this file *and without* the Wi-Fi overlay to get the Ethernet
# configuration:
#
#   west build -b art_pi demo/nanomq_zephyr_stm32_art-pi \
#       -- -DEXTRA_CONF_FILE="local.conf;eth.conf"
#
# Status on the bring-up board: the MAC initialises (no `HAL_ETH_Init failed`,
# no `PHY (0) ID FFFF`) and the interface comes up dormant waiting for carrier.
# That board has no Ethernet cable, so link, DHCP and traffic over Ethernet are
# *not* verified — treat this variant as "the driver runs", nothing more.  Do
# not add a reset-gpios override to &eth_phy (boards/art_pi.overlay, section 3):
# the PA3 guess makes the PHY stop answering MDIO.
#
CONFIG_ETH_STM32_HAL=y
