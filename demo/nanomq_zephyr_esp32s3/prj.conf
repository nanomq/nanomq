# NanoMQ broker → ESP32-S3 (esp32s3_devkitc/esp32s3/procpu) demo config.
#
# Board: ESP32-S3-LCD-EV-Board with an ESP32-S3-WROOM-1-N16R16V module
# (16 MB flash + 16 MB octal PSRAM).  Derived from demo/nanomq_zephyr_qemu_x86/
# prj.conf (qemu_x86) — differences:
#   * QEMU/SLIRP/e1000/static-IP/X86-SSE bits dropped
#   * Wi-Fi STA + DHCPv4 added (native esp32 wifi driver, !SMP procpu)
#   * the broker data plane moves to the PSRAM-backed shared multi-heap
#     (see ESP_SPIRAM / ESP_SPIRAM_HEAP_SIZE here, the dts overlay under
#     boards/, and the NNG_ZEPHYR_ALLOC_SMH allocator in the nng submodule)
#   * feature surface trimmed: MQTT TCP + REST API + WebSocket; webhook and
#     the DEBUG log level stay off (the BROKER_* Kconfig switches are still
#     there — flip them on if PSRAM budget allows)
#
# Wi-Fi credentials are NOT here: BROKER_WIFI_SSID / BROKER_WIFI_PSK come
# from a local, git-ignored conf file (local.conf, see local.conf.example)
# so real SSID/passphrases never land in the tree.

# POSIX API — pthreads/sockets/poll for nng + NanoMQ.  Same Zephyr
# fixed-pool story as the qemu demo: nng creates a mutex/condvar per
# sock/ctx/aio/work and retries forever when the pool is exhausted, so
# budget generously (1024 slots cost only ~30 KB of static arrays).
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=1024
CONFIG_MAX_PTHREAD_COND_COUNT=1024
# Rwlocks track distinct topics in the nanolib subscription tree (one per
# dbtree node); 256 covers the demo scale.
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=256
# nng taskq/poller threads and dynamic POSIX threads live on the kernel
# heap (k_malloc).  DYNAMIC_THREAD_STACK_SIZE is the per-pthread stack:
# 16 threads x 16 KB = 256 KB of the HEAP_MEM_POOL_SIZE budget below.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y
# zvfs_poll() maps the whole poll() fd set onto one shared k_poll_event
# array (Kconfig default 3!); nng's pollq puts every armed socket into a
# single poll(), so budget one slot per listener/connection direction.
CONFIG_ZVFS_POLL_MAX=64

# Networking — the broker accepts MQTT over TCP on the Wi-Fi interface
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y

# Wall clock: this board has no RTC, so time() reports uptime and every log
# line is stamped 1970-01-01.  main.c seeds CLOCK_REALTIME from an SNTP
# server once DHCP has bound (nanolib/log.c formats time(NULL), so a correct
# CLOCK_REALTIME is all the log timestamps need; see PORTING_ZEPHYR.md
# §22-4).
#
# This uses the public sntp_simple() rather than Zephyr's ready-made
# net_init_clock_via_sntp() helper: that helper lives in the net_config
# directory, which subsys/net/lib/CMakeLists.txt only adds to the build when
# CONFIG_NET_CONFIG_SETTINGS=y — and enabling that would pull in net_config's
# static-IP/auto-init module (whose AUTO_INIT defaults to *y*) just to
# compile the one file we want.  Our own seeding is ~25 lines and uses only
# public APIs.
#
# DNS is required because the servers are hostnames — sntp_simple() resolves
# them via getaddrinfo(), and the resolver only accepts literal addresses
# otherwise.  DNS_RESOLVER selects NET_SOCKETS_SERVICE (one more thread plus
# buffers); switch to literal IPv4 server addresses and drop this line if
# SRAM ever gets tight.
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y

# Native ESP32 Wi-Fi (STA).  Driver requirements: the WIFI umbrella
# symbol, !SMP (the single-core procpu target), the espressif HAL blob
# module (fetch with `west blobs fetch hal_espressif` — without the
# blobs WIFI_ESP32 stays silently hidden), and &wifi enabled in the
# board dts (esp32s3_devkitc procpu does this).
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
# Keep the STA bring-up in main.c deterministic (wait CONNECT_RESULT, then
# start the DHCPv4 client ourselves): with WIFI_STA_AUTO_DHCPV4=y (driver
# auto-selects it when DHCPv4 is on) the driver starts DHCP itself and
# never raises NET_EVENT_WIFI_CONNECT_RESULT — main.c would stall on the
# semaphore until its 30 s timeout.
CONFIG_WIFI_STA_AUTO_DHCPV4=n
# No driver-side auto-reconnect: the esp lib then loops inside CONNECTING
# and answers our next connect request with -EALREADY.  main.c retries
# with its own cadence instead.
CONFIG_ESP32_WIFI_STA_RECONNECT=n
# Move the Wi-Fi driver + net-stack static buffer pools (.noinit) into
# PSRAM (esp32s3 default.ld relocates those libs when this is on) —
# frees ~100 KB+ of internal SRAM at the cost of PSRAM-backed buffers.
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# PSRAM (16 MB octal on the LCD-EV module; see the dts overlay under
# boards/).  The linker reserves a heap window of ESP_SPIRAM_HEAP_SIZE
# inside the PSRAM mapping and soc/espressif/common registers it as a
# shared multi-heap region (SMH_REG_ATTR_EXTERNAL); the nng allocator
# built with NNG_ZEPHYR_ALLOC_SMH (CMakeLists) serves the broker data
# plane from it — internal SRAM (~416 KB usable) cannot hold the broker.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
# ESP_SPIRAM_SIZE normally mirrors the psram0 node's `size` in the dts
# (16 MB on this board — see boards/esp32s3_devkitc_procpu.overlay), but
# that Kconfig default is evaluated from an un-prompted dt-backed symbol
# that did not pick the app overlay up; set it explicitly (16777216 =
# 16 MB) so the linker's .ext_ram sizing/ASSERT matches the real part.
CONFIG_ESP_SPIRAM_SIZE=16777216
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
# Relocate whole libraries' .bss into PSRAM (.ext_ram.data): the Zephyr
# POSIX object pools (1024 mutexes + 1024 condvars + 256 rwlocks ≈ 60 KB)
# and the net_buf data pools only serve post-boot broker traffic, so they
# never need to live in the ~416 KB internal SRAM.
CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libsubsys__portability__posix__options.a liblib__net_buf.a"

# Kernel heap (k_malloc): pthread stacks (16 x 16 KB worst case), the
# Wi-Fi driver allocation (adds HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI on top)
# and Zephyr internals.  Static SRAM budget is ~416 KB (sram1) — tune
# against the linker map; broker data is NOT here (see PSRAM above).
# 192 KB leaves the rest of dram0_0_seg (currently ~97 % full at 256 KB)
# as headroom for the libc (picolibc sbrk) heap, which serves the raw
# malloc/calloc calls scattered through nanolib/nanomq (cJSON, REST
# buffers): at 256 KB pool that headroom was ~9 KB and any REST JSON
# would OOM.  Live pthread count is well under the 16-thread worst case
# (nng taskq is capped at 2 by the ExternalProject args), so the smaller
# pool only risks starving pthread_create if all 16 are up at once —
# raise it again if boot shows allocation failures.
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_STACK_SIZE=16384

# Net-stack pools — broker scale.  With ESP32_WIFI_NET_ALLOC_SPIRAM the
# packet/buffer pools live in PSRAM, so these are budget, not RAM.
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
# Every socket (listening or connected) takes one net_context + one
# net_conn; pool exhaustion makes Zephyr's TCP answer SYN with RST.
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=32

CONFIG_PRINTK=y

# Float support in picolibc's printf: the REST API serialises numbers with
# cJSON, whose printer uses "%g" — without this, every numeric field comes
# out as the literal "*float*" and the JSON is unparseable.
CONFIG_PICOLIBC_IO_FLOAT=y

# NanoMQ HTTP REST API — conf http_server.enable + BASIC auth with the
# credentials from CONFIG_BROKER_REST_USER / _PASS (Kconfig BROKER_REST_API
# enables the listener).  Served on tcp:8081; conf_init defaults
# http_server.enable to false, so without this switch there is no listener on
# 8081.  Clients must send credentials:
#   curl -u admin:public http://<board-ip>:8081/api/v4/...
# The demo defaults to the published admin/public pair and warns at boot;
# the board is on your LAN, so set your own in local.conf for real use.
# Basic over plain HTTP is base64, not encryption — TLS is out of the
# Zephyr NanoNNG build.
CONFIG_BROKER_REST_API=y

# NanoMQ WebSocket listener (MQTT over RFC6455 on tcp:8083/mqtt), same
# surface as the qemu demo: the mqttws transport is already in the
# NanoNNG build, and the functional suite's rest_get group asserts the
# runtime websocket conf mirrors the listener (as does the sibling
# qemu demo).  webhook / DEBUG log stay off.
CONFIG_BROKER_WS=y
