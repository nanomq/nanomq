# Minimal broker used only by the MQTT 5 Topic Alias function test.

mqtt {
    max_topic_alias = 1024
    max_mqueue_len = 2048
}

listeners.ssl {
    bind = "0.0.0.0:8884"
    keyfile = "etc/certs/key.pem"
    certfile = "etc/certs/cert.pem"
    cacertfile = "etc/certs/cacert.pem"
    verify_peer = false
    fail_if_no_peer_cert = false
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}
