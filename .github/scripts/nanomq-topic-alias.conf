# Minimal broker used only by the MQTT 5 Topic Alias function test.

# Keep this file free of listeners.* blocks. NanoNNG currently enables its
# default WSS listener whenever it parses a listeners.* object; the test
# broker selects its TLS listener through --url instead.

mqtt {
    max_topic_alias = 1024
    max_mqueue_len = 2048
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}
